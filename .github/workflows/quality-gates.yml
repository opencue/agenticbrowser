name: Quality Gates

on:
  pull_request:
    paths:
      - ".github/workflows/quality-gates.yml"
      - "lefthook.yml"
      - "package/ego-browser-v2/**"
      - "package/ego-linux/**"
      - "package/ego-linux-host/**"
      - "skills/ego-browser/learnings/**"
  push:
    branches:
      - dev
      - main
    paths:
      - ".github/workflows/quality-gates.yml"
      - "lefthook.yml"
      - "package/ego-browser-v2/**"
      - "package/ego-linux/**"
      - "package/ego-linux-host/**"
      - "skills/ego-browser/learnings/**"

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package/ego-browser-v2/package-lock.json

      - name: Install dependencies
        working-directory: package/ego-browser-v2
        run: npm ci

      - name: Check changed file style
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi

          files="$(git diff --name-only --diff-filter=ACMR "$base" HEAD | grep -E '^package/ego-(browser-v2|linux|v2-ext)/.*\.(ts|mjs|js|json|md)$' || true)"
          [ -z "$files" ] && exit 0
          package/ego-browser-v2/node_modules/.bin/prettier --check $files

      - name: Analyze vulnerabilities
        working-directory: package/ego-browser-v2
        run: npm audit --registry=https://registry.npmjs.org --audit-level=moderate

      - name: Check code
        working-directory: package/ego-browser-v2
        run: npm run typecheck

      - name: Run smoke tests
        working-directory: package/ego-browser-v2
        # The six skipped tests check upstream's repository layout, which this
        # fork does not have (see ci.yml "test").
        run: >-
          npm run build && npm run typecheck &&
          node --test --test-skip-pattern="^(the bundled entry Skill matches the published entry Skill|the entry Skill defers usage to ego-browser skill|the shared install guide routes to a file per operating system|project Agent and Codex entries share the canonical Skill|branch pushes and pull requests do not package or publish releases|beta and stable tag pushes retain both release guards)$" "src/**/*.test.mjs"

      - name: Validate site skills
        working-directory: package/ego-browser-v2
        run: npm run validate:site-skills

