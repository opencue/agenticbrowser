name: Windows Host

on:
  pull_request:
    paths:
      - ".github/workflows/windows-host.yml"
      - "package/ego-windows-host/**"
  push:
    branches:
      - dev
      - main
    paths:
      - ".github/workflows/windows-host.yml"
      - "package/ego-windows-host/**"

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ego-browser's prepare script is a POSIX shell one-liner, and npm runs
      # package scripts through cmd.exe on Windows, which fails on it with
      # `"$CI" was unexpected at this time`. --ignore-scripts alone does not
      # cover it: npm still prepares a file: dependency. The runner ships the
      # Git Bash that `shell: bash` uses, so npm is pointed at it -- which makes
      # the existing script work rather than rewriting one this workflow does
      # not own. (Was #148; the same fix is in ci.yml's Windows jobs.)
      - name: Let npm run POSIX package scripts
        run: npm config set script-shell bash

      # --ignore-scripts: installing the file:../ego-browser dependency would
      # otherwise run lefthook install, which is unnecessary in CI.
      - name: Install dependencies
        working-directory: package/ego-windows-host
        run: npm ci --ignore-scripts

      - name: Build ego-browser dependency
        working-directory: package/ego-browser
        run: npm ci --ignore-scripts && npm run build

      - name: Run tests
        working-directory: package/ego-windows-host
        run: npm test
