name: CI

on:
  push:
    branches:
      - dev
      - main
    tags:
      - "v*.*.*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: package/ego-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package/ego-browser/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run validate:site-skills

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package/ego-browser/package-lock.json
            package/ego-linux/package-lock.json
      # The CLI runs the harness's build output, so the harness has to be built
      # before the port can be tested. CI=true is already set by Actions, which
      # is what lets `npm ci` skip the lefthook install in the prepare script.
      - name: Build the harness the port runs
        working-directory: package/ego-browser
        run: npm ci && npm run build
      # The suite drives a real headless Chromium. The runner image ships one;
      # failing here rather than inside a test says so plainly.
      - name: Check for a browser
        run: google-chrome --version
      - name: Test the port
        working-directory: package/ego-linux
        run: npm ci --ignore-scripts && npm test

  test-linux-host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: package/ego-linux-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package/ego-linux-host/package-lock.json
      - run: npm ci
      - run: npm test

  # The same package as test-linux, on the other operating system it supports.
  # Everything platform-specific in it lives behind src/platform.mjs, and
  # test/platform.test.mjs checks the Windows branch from Linux — but only a
  # Windows runner proves the branch against a real process table, a real
  # PowerShell and a real browser.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package/ego-browser/package-lock.json
            package/ego-linux/package-lock.json
      # package/ego-browser's `prepare` script is a POSIX shell one-liner, and npm
      # runs package scripts through cmd.exe on Windows, which fails on it with
      # `"$CI" was unexpected at this time`. The runner ships Git Bash — that is
      # what `shell: bash` uses — so pointing npm at it makes the existing script
      # work rather than rewriting a script this port does not own.
      - name: Let npm run POSIX package scripts
        run: npm config set script-shell bash

      - name: Install the native Windows CLI from this checkout
        shell: pwsh
        run: |
          .\skills\ego-browser\scripts\install-windows.ps1 -NoDoctor
          & "$env:LOCALAPPDATA\Programs\ego-lite\bin\ego-browser.cmd" --doctor --json
      # Ask the port's own resolver, not a hard-coded path: if Chrome moves on
      # the runner image, this fails here saying which paths were tried instead
      # of failing deep inside a browser test.
      - name: Check for a browser
        working-directory: package/ego-linux
        run: node -e "import('./src/platform.mjs').then(p => p.resolveBrowserBinary()).then(console.log)"
      - name: Test the port
        working-directory: package/ego-linux
        run: npm ci --ignore-scripts && npm test

  # Produce the one file a Windows user has to download.
  #
  # Everything the installer contains is decided by installer/stage.mjs and
  # checked by test/installer.test.mjs, which runs on Linux — this job's own job
  # is the two things that need Windows: fetching the runtime it bundles, and
  # running the Inno Setup compiler.
  build-windows-installer:
    runs-on: windows-latest
    needs: test-windows
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package/ego-browser/package-lock.json
            package/ego-linux/package-lock.json
      # package/ego-browser's `prepare` script is a POSIX shell one-liner, and npm
      # runs package scripts through cmd.exe on Windows, which fails on it with
      # `"$CI" was unexpected at this time`. The runner ships Git Bash — that is
      # what `shell: bash` uses — so pointing npm at it makes the existing script
      # work rather than rewriting a script this port does not own.
      - name: Let npm run POSIX package scripts
        run: npm config set script-shell bash

      - name: Build the harness the installer ships
        working-directory: package/ego-browser
        run: npm ci && npm run build

      - name: Install the MCP runtime dependencies the installer ships
        working-directory: package/ego-linux
        run: npm ci --omit=dev --ignore-scripts

      # Bundle node.exe plus the production-only MCP dependencies staged below.
      - name: Fetch the Node runtime to bundle
        shell: pwsh
        run: |
          $version = (node --version)
          $url = "https://nodejs.org/dist/$version/node-$version-win-x64.zip"
          Write-Host "bundling $version from $url"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-dist
          Copy-Item "node-dist\node-$version-win-x64\node.exe" node.exe
          # The bundled runtime has to be able to run, not just exist.
          .\node.exe --version

      - name: Stage the payload
        working-directory: package/ego-linux
        run: node installer/stage.mjs --node ${{ github.workspace }}\node.exe

      - name: Compile the installer
        working-directory: package/ego-linux
        shell: pwsh
        run: |
          # The runner image ships Inno Setup, but that is an image detail
          # rather than a guarantee — installing it when absent costs a minute
          # and turns a future image change from a broken build into a slow one.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not on this image; installing"
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "no ISCC.exe at $iscc" }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          & $iscc /DAppVersion=$version installer\ego-lite.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      # An installer that lost its payload still compiles; a few hundred KB is
      # what that looks like, so fail here rather than shipping it.
      - name: Check the installer is not empty
        shell: pwsh
        run: |
          $exe = Get-Item package\ego-linux\installer\dist\ego-lite-setup.exe
          Write-Host "$($exe.Name): $([math]::Round($exe.Length / 1MB, 1)) MB"
          if ($exe.Length -lt 15MB) { throw "the installer is too small to contain the Node runtime" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content "$($exe.FullName).sha256" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: ego-lite-setup
          path: package/ego-linux/installer/dist/ego-lite-setup.exe*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, test-windows, build-windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: package/ego-browser
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package/ego-browser/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: ego-lite-setup
          path: ${{ runner.temp }}/windows-installer
      - run: npm ci
      - run: npm run build
      - name: Resolve release channel
        id: release
        run: |
          ref_name="${GITHUB_REF_NAME}"
          supported="true"
          previous_tag=""

          if [[ "$ref_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            release_tag="$ref_name"
            version_tag="$ref_name"
            title="Beta $ref_name"
            prerelease="true"
            latest="false"
            previous_tag="$(git tag --merged HEAD --sort=-creatordate --list 'v*.*.*-beta.*' | grep -v "^$release_tag$" | head -1 || true)"
          elif [[ "$ref_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_tag="$ref_name"
            version_tag="$ref_name"
            title="ego lite $ref_name"
            prerelease="false"
            latest="true"
            previous_tag="$(git tag --merged HEAD --sort=-creatordate --list 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^$release_tag$" | head -1 || true)"
          else
            echo "Unsupported release ref: $ref_name"
            supported="false"
          fi

          {
            echo "supported=$supported"
            echo "release_tag=$release_tag"
            echo "version_tag=$version_tag"
            echo "title=$title"
            echo "prerelease=$prerelease"
            echo "latest=$latest"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"
      - name: Package release payload
        if: steps.release.outputs.supported == 'true'
        run: |
          version_tag="${{ steps.release.outputs.version_tag }}"
          cd dist/out
          zip -r "../ego-browser-${version_tag}.zip" .
      - name: Create release
        if: steps.release.outputs.supported == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"

          release_tag="${{ steps.release.outputs.release_tag }}"
          version_tag="${{ steps.release.outputs.version_tag }}"
          title="${{ steps.release.outputs.title }}"
          prerelease="${{ steps.release.outputs.prerelease }}"
          latest="${{ steps.release.outputs.latest }}"
          previous_tag="${{ steps.release.outputs.previous_tag }}"
          commit_sha="$(git rev-parse HEAD)"
          artifact="package/ego-browser/dist/ego-browser-${version_tag}.zip"
          windows_installer="${RUNNER_TEMP}/windows-installer/ego-lite-setup.exe"
          windows_checksum="${windows_installer}.sha256"
          notes_file="$(mktemp)"
          release_args=()
          notes_args=()

          if [ "$prerelease" = "false" ] && ! git merge-base --is-ancestor "$commit_sha" origin/main; then
            echo "Stable release tags must point to commits reachable from main."
            exit 1
          fi

          if [ "$prerelease" = "true" ]; then
            release_args+=(--prerelease)
          fi

          if [ "$latest" = "true" ]; then
            release_args+=(--latest)
          else
            release_args+=(--latest=false)
          fi

          if [ -n "$previous_tag" ]; then
            notes_args+=(-f "previous_tag_name=$previous_tag")
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$release_tag" \
            -f target_commitish="$commit_sha" \
            "${notes_args[@]}" \
            --jq .body > "$notes_file"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release edit "$release_tag" \
              --title "$title" \
              --notes-file "$notes_file" \
              "${release_args[@]}"
            gh release upload "$release_tag" \
              "$artifact" "$windows_installer" "$windows_checksum" --clobber
          else
            gh release create "$release_tag" \
              --title "$title" \
              --notes-file "$notes_file" \
              --verify-tag \
              "${release_args[@]}" \
              "$artifact" "$windows_installer" "$windows_checksum"
          fi
