name: CI

on:
  push:
    branches:
      - dev
      - main
    tags:
      - "v*.*.*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: package/ego-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package/ego-browser/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run validate:site-skills

  test-host:
    name: Test Chromium host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package/ego-browser/package-lock.json
      - name: Build the ego-browser harness
        working-directory: package/ego-browser
        run: npm ci && npm run build
      - name: Resolve the installed Chromium-family browser
        working-directory: package/ego-linux
        run: node -e "import('./src/platform.mjs').then(p => p.resolveBrowserBinary()).then(console.log)"
      - name: Test the host runtime
        working-directory: package/ego-linux
        run: npm test

  build-windows-installer:
    runs-on: windows-latest
    needs: test-host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package/ego-browser/package-lock.json
      - name: Build the harness
        working-directory: package/ego-browser
        run: npm ci && npm run build
      - name: Fetch the Node runtime to bundle
        shell: pwsh
        run: |
          $version = (node --version)
          $url = "https://nodejs.org/dist/$version/node-$version-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-dist
          Copy-Item "node-dist\node-$version-win-x64\node.exe" node.exe
          .\node.exe --version
      - name: Stage the installer payload
        working-directory: package/ego-linux
        run: node installer/stage.mjs --node ${{ github.workspace }}\node.exe
      - name: Compile the installer
        working-directory: package/ego-linux
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "no ISCC.exe at $iscc" }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          & $iscc /DAppVersion=$version installer\ego-lite.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
      - name: Check and upload the installer
        shell: pwsh
        run: |
          $exe = Get-Item package\ego-linux\installer\dist\ego-lite-setup.exe
          if ($exe.Length -lt 15MB) { throw "installer is too small to contain the Node runtime" }
      - uses: actions/upload-artifact@v4
        with:
          name: ego-lite-setup
          path: package/ego-linux/installer/dist/ego-lite-setup.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: package/ego-browser
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package/ego-browser/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Resolve release channel
        id: release
        run: |
          ref_name="${GITHUB_REF_NAME}"
          supported="true"
          previous_tag=""

          if [[ "$ref_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            release_tag="$ref_name"
            version_tag="$ref_name"
            title="Beta $ref_name"
            prerelease="true"
            latest="false"
            previous_tag="$(git tag --merged HEAD --sort=-creatordate --list 'v*.*.*-beta.*' | grep -v "^$release_tag$" | head -1 || true)"
          elif [[ "$ref_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_tag="$ref_name"
            version_tag="$ref_name"
            title="ego lite $ref_name"
            prerelease="false"
            latest="true"
            previous_tag="$(git tag --merged HEAD --sort=-creatordate --list 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^$release_tag$" | head -1 || true)"
          else
            echo "Unsupported release ref: $ref_name"
            supported="false"
          fi

          {
            echo "supported=$supported"
            echo "release_tag=$release_tag"
            echo "version_tag=$version_tag"
            echo "title=$title"
            echo "prerelease=$prerelease"
            echo "latest=$latest"
            echo "previous_tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"
      - name: Package release payload
        if: steps.release.outputs.supported == 'true'
        run: |
          version_tag="${{ steps.release.outputs.version_tag }}"
          cd dist/out
          zip -r "../ego-browser-${version_tag}.zip" .
      - name: Create release
        if: steps.release.outputs.supported == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"

          release_tag="${{ steps.release.outputs.release_tag }}"
          version_tag="${{ steps.release.outputs.version_tag }}"
          title="${{ steps.release.outputs.title }}"
          prerelease="${{ steps.release.outputs.prerelease }}"
          latest="${{ steps.release.outputs.latest }}"
          previous_tag="${{ steps.release.outputs.previous_tag }}"
          commit_sha="$(git rev-parse HEAD)"
          artifact="package/ego-browser/dist/ego-browser-${version_tag}.zip"
          notes_file="$(mktemp)"
          release_args=()
          notes_args=()

          if [ "$prerelease" = "false" ] && ! git merge-base --is-ancestor "$commit_sha" origin/main; then
            echo "Stable release tags must point to commits reachable from main."
            exit 1
          fi

          if [ "$prerelease" = "true" ]; then
            release_args+=(--prerelease)
          fi

          if [ "$latest" = "true" ]; then
            release_args+=(--latest)
          else
            release_args+=(--latest=false)
          fi

          if [ -n "$previous_tag" ]; then
            notes_args+=(-f "previous_tag_name=$previous_tag")
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$release_tag" \
            -f target_commitish="$commit_sha" \
            "${notes_args[@]}" \
            --jq .body > "$notes_file"

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release edit "$release_tag" \
              --title "$title" \
              --notes-file "$notes_file" \
              "${release_args[@]}"
            gh release upload "$release_tag" "$artifact" --clobber
          else
            gh release create "$release_tag" \
              --title "$title" \
              --notes-file "$notes_file" \
              --verify-tag \
              "${release_args[@]}" \
              "$artifact"
          fi
