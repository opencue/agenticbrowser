name: Main PR Source

on:
  pull_request:
    branches:
      - main

jobs:
  require-dev-source:
    # Upstream's dev→main branch policy. This fork works on feature branches
    # straight into main (dev and main have long diverged here), so the check
    # only applies on the upstream repository — on the fork it skips instead
    # of failing every PR and drowning real CI signal in structural red.
    if: github.repository == 'citrolabs/ego-lite'
    runs-on: ubuntu-latest
    steps:
      - name: Require dev or hotfix/docs branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Regular releases flow dev -> main. hotfix/* and docs/* are the
          # sanctioned fast lanes for fixes that cannot wait for a release
          # and must not drag unfinished work from dev into main.
          case "$HEAD_REF" in
            dev|hotfix/*|docs/*)
              echo "Allowed source branch: $HEAD_REF"
              ;;
            *)
              echo "Pull requests into main must come from dev, hotfix/*, or docs/*."
              exit 1
              ;;
          esac
