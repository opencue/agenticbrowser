# lefthook.yml - git hooks for ego-lite
#
# Enable hooks:
#   cd package/ego-browser-v2 && npm install
#
# lefthook is a package/ego-browser-v2 devDependency. npm install runs the
# prepare script, which installs hooks into the repository's .git/hooks.
#
# The git root is the repository root, while the runtime package lives in
# package/ego-browser-v2. Commands cd into that package when needed.

pre-commit:
  parallel: false
  commands:
    # Fork change: upstream checks against origin/dev, its integration branch.
    # This fork is cut from upstream main and publishes to origin/main, so
    # it is permanently "behind" dev and that check blocked every commit here.
    # Checking against the branch we actually publish to keeps the intent —
    # don't commit onto a stale branch — without the false positive.
    branch-up-to-date:
      run: |
        base="${EGO_FORK_BASE_BRANCH:-main}"
        git fetch --quiet origin "$base" 2>/dev/null || { echo "⚠ skip branch-freshness check: cannot fetch origin/$base (offline?)"; exit 0; }
        if git merge-base --is-ancestor FETCH_HEAD HEAD; then
          exit 0
        fi
        echo "✗ Your branch is behind origin/$base — sync before committing:"
        echo "    git fetch origin $base && git rebase origin/$base   # or: git merge origin/$base"
        exit 1
    style-check:
      run: |
        files=$(git diff --cached --name-only --diff-filter=ACMR | grep -E '^package/ego-(browser-v2|linux|v2-ext)/.*\.(ts|mjs|js|json|md)$' || true)
        [ -z "$files" ] && exit 0
        package/ego-browser-v2/node_modules/.bin/prettier --check $files
    vulnerability-audit:
      run: |
        git diff --cached --name-only --diff-filter=ACMR | grep -q '^package/ego-browser-v2/' || exit 0
        cd package/ego-browser-v2 && npm audit --registry=https://registry.npmjs.org --audit-level=moderate
    code-check:
      run: |
        git diff --cached --name-only --diff-filter=ACMR | grep -q '^package/ego-browser-v2/' || exit 0
        cd package/ego-browser-v2 && npm run typecheck
    smoke-test:
      run: |
        git diff --cached --name-only --diff-filter=ACMR | grep -q '^package/ego-browser-v2/' || exit 0
        # Skips the six mirror tests about upstream's repository layout (see
        # the CI "test" job).
        cd package/ego-browser-v2 && npm run build && npm run typecheck && node --test --test-skip-pattern="^(the bundled entry Skill matches the published entry Skill|the entry Skill defers usage to ego-browser skill|the shared install guide routes to a file per operating system|project Agent and Codex entries share the canonical Skill|branch pushes and pull requests do not package or publish releases|beta and stable tag pushes retain both release guards)$" "src/**/*.test.mjs"
    site-skill-validation:
      run: |
        git diff --cached --name-only --diff-filter=ACMR | grep -Eq '^(package/ego-browser-v2/|skills/ego-browser/learnings/)' || exit 0
        cd package/ego-browser-v2 && npm run validate:site-skills
    e2e-test:
      run: |
        git diff --cached --name-only --diff-filter=ACMR | grep -q '^package/ego-browser-v2/' || exit 0
        cd package/ego-browser-v2 && npm run e2e
    # The port drives the runtime's build output plus the v2 extensions, so a
    # change to any of them can break it. The suites are headless and use their
    # own profiles.
    linux-port-test:
      run: |
        git diff --cached --name-only --diff-filter=ACMR | grep -Eq '^package/ego-(browser-v2|linux|v2-ext)/' || exit 0
        cd package/ego-linux && npm test && cd ../ego-v2-ext && npm test
